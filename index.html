<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Ghibli</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/075a7c0c69.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div id="cont">
            <div id="divimg"><img src="img/logo.svg" alt="logo"></div>
            <nav>
                <a href=""><img src="img/logo-google.svg" alt="" class="logosocial"></a>
                <a href=""><img src="img/logo-facebook.svg" alt="" class="logosocial"></a>
                <a href=""><img src="img/logo-twitter.svg" alt="" class="logosocial"></a>
                <a href=""><img src="img/logo-instagram.svg" alt="" class="logosocial"></a>
            </nav>
        </div>
    </header>
    <main>

        <section>
            <div id="text">
                <span> HAYAO MIYAZAKI</span>
                <h1>A VIAGEM
                    DE CHIHIRO
                </h1>
                <p>Chihiro chega a um mundo mágico dominado
                    por uma bruxa. Aqueles que a desobedecem
                    são transformados em animais.
                </p>
            </div>

            <div id="ghost">
                <img src="img/image.svg" alt="">
            </div>
        </section>

        <section id="sdvbt">
            <div id="dvbt">
                <button type="submit" id="btimg"><i class="fa-solid fa-play"></i>ASSISTIR AGORA</button>
                <button type="submit" id="bttrailer">VEJA O TRAILER</button>
            </div>
        </section>


    </main>

</html>
